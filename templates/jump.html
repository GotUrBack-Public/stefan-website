<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mega Jump 'n' Run</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; user-select: none; }
        h1 { margin: 5px; font-size: 26px; color: #ff4757; text-shadow: 0 0 10px rgba(255, 71, 87, 0.4); }
        #gameContainer { position: relative; border: 4px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.6); border-radius: 8px; }
        canvas { display: block; background: #1e272e; }
        .hud { position: absolute; top: 15px; left: 20px; font-size: 22px; font-family: monospace; font-weight: bold; text-shadow: 1px 1px 2px #000; pointer-events: none; color: #ffd32a; }
    </style>
</head>
<body>

    <h1>INFINITE JUMP 🚀</h1>
    <div id="gameContainer">
        <div class="hud">HIGH-SCORE: <span id="scoreLabel">0</span></div>
        <canvas id="jumpCanvas" width="450" height="600"></canvas>
    </div>
    <p style="color:#888; margin-top:10px; font-size:14px;">Steuerung: <b>A / D</b> oder <b>Pfeiltasten</b> zum Bewegen nach links & rechts</p>

    <script>
        const canvas = document.getElementById("jumpCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let maxScore = 0;
        let gameOver = false;
        let gameStarted = false;

        // Spieler-Eigenschaften
        const player = {
            x: 210,
            y: 400,
            width: 30,
            height: 30,
            vx: 0,
            vy: 0,
            gravity: 0.3,
            jumpStrength: -9.5,
            speed: 5
        };

        let platforms = [];
        const keys = {};

        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (gameOver || !gameStarted) {
                if (e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp" || e.code === "KeyA" || e.code === "KeyD" || e.code === "ArrowLeft" || e.code === "ArrowRight") {
                    resetGame();
                }
            }
        });
        window.addEventListener("keyup", e => keys[e.code] = false);

        // Plattformen generieren
        function generatePlatforms() {
            platforms = [];
            // Startplattform direkt unter dem Spieler
            platforms.push({ x: 180, y: 500, width: 90, height: 12 });
            
            // Weitere Plattformen nach oben verteilen
            for (let i = 0; i < 8; i++) {
                platforms.push({
                    x: Math.random() * (canvas.width - 80),
                    y: 500 - (i * 75) - Math.random() * 20,
                    width: 80,
                    height: 12
                });
            }
        }

        function resetGame() {
            player.x = 210;
            player.y = 400;
            player.vx = 0;
            player.vy = player.jumpStrength; // Direkt nach oben springen zum Start
            score = 0;
            maxScore = 0;
            gameOver = false;
            gameStarted = true;
            generatePlatforms();
            document.getElementById("scoreLabel").innerText = score;
        }

        function update() {
            if (!gameStarted || gameOver) return;

            // Bewegung links / rechts
            if (keys["KeyA"] || keys["ArrowLeft"]) player.vx = -player.speed;
            else if (keys["KeyD"] || keys["ArrowRight"]) player.vx = player.speed;
            else player.vx = 0;

            // Schwerkraft auf den Spieler anwenden
            player.vy += player.gravity;
            player.x += player.vx;
            player.y += player.vy;

            // Bildschirm-Rand-Wechsel (wie bei Pacman/Doodle Jump)
            if (player.x + player.width < 0) player.x = canvas.width;
            if (player.x > canvas.width) player.x = -player.width;

            // Kamera-Scrollen: Wenn der Spieler die obere Bildschirmhälfte erreicht
            if (player.y < canvas.height / 2) {
                let diff = (canvas.height / 2) - player.y;
                player.y = canvas.height / 2;
                
                // Alle Plattformen nach unten verschieben
                platforms.forEach(p => {
                    p.y += diff;
                });

                // Score erhöhen basierend auf der Höhe
                maxScore += Math.floor(diff);
                if (maxScore > score) {
                    score = maxScore;
                    document.getElementById("scoreLabel").innerText = score;
                }
            }

            // Neue Plattformen oben nachspawnen und alte unten löschen
            platforms.forEach((p, idx) => {
                if (p.y > canvas.height) {
                    platforms.splice(idx, 1);
                    platforms.push({
                        x: Math.random() * (canvas.width - 80),
                        y: -10 - Math.random() * 20,
                        width: 80,
                        height: 12
                    });
                }
            });

            // Kollision nur beim FALLEN abfragen (vy > 0)
            if (player.vy > 0) {
                platforms.forEach(p => {
                    if (player.x + player.width > p.x &&
                        player.x < p.x + p.width &&
                        player.y + player.height >= p.y &&
                        player.y + player.height <= p.y + p.height + player.vy) {
                        
                        // Sprung auslösen!
                        player.vy = player.jumpStrength;
                    }
                });
            }

            // Absturz -> Game Over
            if (player.y > canvas.height) {
                gameOver = true;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Plattformen zeichnen
            ctx.fillStyle = "#2ecc71"; // Knalliges Grün
            platforms.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
                // Kleiner Schatten-Effekt für die Plattformen
                ctx.fillStyle = "#27ae60";
                ctx.fillRect(p.x, p.y + p.height - 3, p.width, 3);
                ctx.fillStyle = "#2ecc71";
            });

            // Spieler zeichnen (Ein cooler kleiner Astronauten-Würfel)
            ctx.fillStyle = "#00ffff"; // Cyan-Blau
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Dem Spieler ein kleines Gesicht verpassen, damit man sieht, wo vorne ist
            ctx.fillStyle = "#fff";
            ctx.fillRect(player.x + 6, player.y + 6, 6, 6);
            ctx.fillRect(player.x + 18, player.y + 6, 6, 6);

            // Startbildschirm oder Game Over Einblendung
            if (!gameStarted) {
                ctx.fillStyle = "rgba(0,0,0,0.75)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ffffff";
                ctx.font = "22px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("Bist du bereit?", canvas.width / 2, canvas.height / 2 - 30);
                ctx.fillStyle = "#ff4757";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText("Drücke eine Taste zum Starten!", canvas.width / 2, canvas.height / 2 + 20);
            } else if (gameOver) {
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#ff4757";
                ctx.font = "32px 'Segoe UI'";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER 💥", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillStyle = "#ffffff";
                ctx.font = "18px 'Segoe UI'";
                ctx.fillText(`Dein Score: ${score} Punkte`, canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillStyle = "#ffd32a";
                ctx.fillText("Drücke eine beliebige Taste für Replay", canvas.width / 2, canvas.height / 2 + 80);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        generatePlatforms();
        gameLoop();
    </script>
</body>
</html>
