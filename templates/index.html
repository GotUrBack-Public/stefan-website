<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEFAN | Game & Community Management</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #0d0f12;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Massive, breite Navbar */
        .navbar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: #ffffff;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Highlight Button für den Spiele-Hub */
        .nav-links a.hub-btn {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .nav-links a.hub-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        /* Hauptinhalt */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 800px;
            margin-top: 60px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .cta-btn {
            background-color: #ffffff;
            color: #0d0f12;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
        }

        .cta-btn:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Reparierte Navigation -->
    <nav class="navbar">
        <a href="/" class="logo">STEFAN</a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="#">Über mich</a>
            <a href="#">Projekte</a>
            <a href="/spiele-hub" class="hub-btn">Spiele-Hub 🎮</a>
        </div>
    </nav>

    <!-- Hero Sektion -->
    <main class="hero">
        <h1>Game & Community Management</h1>
        <p>Willkommen auf meiner offiziellen Website. Hier findest du Informationen über meine Arbeit, aktuelle Projekte und exklusive Mini-Games direkt im Web-Hub.</p>
        <a href="/spiele-hub" class="cta-btn">Jetzt Spiele entdecken</a>
    </main>

</body>
</html>
