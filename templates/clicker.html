<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Monster Clicker</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding-top: 50px; }
        .box { background: #333; padding: 20px; display: inline-block; border-radius: 10px; min-width: 300px; }
        button { font-size: 18px; padding: 10px 20px; margin: 10px; cursor: pointer; border-radius: 5px; border: none; }
        .btn-angriff { background: #e74c3c; color: white; }
        .btn-upgrade { background: #2ecc71; color: white; }
        .btn-back { background: #7f8c8d; color: white; display: block; margin: 20px auto; width: 100px; text-decoration: none; padding: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Monster Clicker ⚔️</h1>
        <h2>Level: <span id="level">1</span></h2>
        <p>Monster HP: <span id="monster_hp">10</span> / <span id="monster_max_hp">10</span></p>
        <p>Dein Gold: <span id="gold">0</span> 💰</p>
        <p>Schaden pro Klick: <span id="schaden">1</span></p>
        
        <button class="btn-angriff" onclick="sendeAktion('/angriff')">Monster Angreifen!</button>
        <button class="btn-upgrade" onclick="sendeAktion('/upgrade')">Upgrade Kaufen (<span id="kosten">10</span> Gold)</button>
        
        <a href="/" class="btn-back">Zurück</a>
    </div>

    <script>
        function aktualisiereAnzeige(daten) {
            document.getElementById("level").innerText = daten.level;
            document.getElementById("monster_hp").innerText = daten.monster_hp;
            document.getElementById("monster_max_hp").innerText = daten.monster_max_hp;
            document.getElementById("gold").innerText = daten.gold;
            document.getElementById("schaden").innerText = daten.schaden;
            document.getElementById("kosten").innerText = daten.upgrade_kosten;
        }

        function sendeAktion(url) {
            fetch(url, { method: "POST" })
                .then(res => res.json())
                .then(daten => aktualisiereAnzeige(daten));
        }

        // Lade Startdaten beim Öffnen der Seite
        fetch('/daten').then(res => res.json()).then(daten => aktualisiereAnzeige(daten));
    </script>
</body>
</html>
