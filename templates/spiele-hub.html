´<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEFANS SPIELE 🎮</title>
    <style>
        body {
            background-color: #05070a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            text-align: center;
            /* Das System mit den cleanen blauen Blitzen an den Seiten */
            background-image: 
                linear-gradient(90deg, rgba(0, 240, 255, 0.15) 0%, transparent 15%, transparent 85%, rgba(0, 240, 255, 0.15) 100%),
                radial-gradient(circle at 10% 30%, #00f0ff 1px, transparent 1px),
                radial-gradient(circle at 90% 70%, #00f0ff 1px, transparent 1px);
            background-size: 100% 100%, 150px 150px, 150px 150px;
            min-height: 100vh;
        }

        /* Der große, cleane blaue Titel-Kasten */
        .title-box {
            border: 3px solid #00c8ff;
            background-color: rgba(5, 7, 10, 0.8);
            border-radius: 16px;
            padding: 25px;
            max-width: 600px;
            margin: 0 auto 50px auto;
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3), inset 0 0 15px rgba(0, 200, 255, 0.1);
        }

        .title-box h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00c8ff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
        }

        .title-box p {
            margin: 5px 0 0 0;
            color: #94a3b8;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Das exakte Grid für deine 4 Spiele */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto 50px auto;
        }

        @media (max-width: 900px) {
            .games-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Die dunklen, cleanen Spiele-Karten */
        .game-card {
            background-color: #11141a;
            border: 1px solid #1e2530;
            border-radius: 12px;
            padding: 30px 20px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #00c8ff;
            box-shadow: 0 8px 20px rgba(0, 200, 255, 0.15);
        }

        .game-icon {
            font-size: 2.5rem;
        }

        .game-card span:last-child {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }

        /* Zurück-Button */
        .back-btn {
            display: inline-block;
            background-color: #1e2530;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .back-btn:hover {
            background-color: #00c8ff;
            color: #05070a;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- STEFANS SPIELE Titelbox -->
    <div class="title-box">
        <h1>🎮 STEFANS SPIELE</h1>
        <p>Premium Game Collection</p>
    </div>

    <!-- Deine 4 Spiele nebeneinander aufgereiht -->
    <div class="games-grid">
        <a href="/clicker" class="game-card">
            <span class="game-icon">⚔️</span>
            <span>Monster Clicker</span>
        </a>
        <a href="/shooter" class="game-card">
            <span class="game-icon">🚀</span>
            <span>Space Shooter</span>
        </a>
        <a href="/racing" class="game-card">
            <span class="game-icon">🏎️</span>
            <span>Turbo Racer</span>
        </a>
        <a href="/jump" class="game-card">
            <span class="game-icon">🦘</span>
            <span>Infinite Jump</span>
        </a>
    </div>

    <br>
    <a href="/" class="back-btn">⬅️ Zurück zur Startseite</a>

</body>
</html>
